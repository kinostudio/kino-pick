name: Deploy scoped B collaboration validation
run-name: Scoped B collaboration validation @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA with successful checks workflow
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'kinostudio/kino-pick'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate repository and pinned source SHA
        run: node tools/check-staging-collaboration-release.mjs --validate-input
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build product Worker and frontend
        run: pnpm build

      - name: Build scoped Worker profile without deploying
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --dry-run --config wrangler.collaboration-validation.jsonc --outdir .local/collaboration-validation-build

      - name: Run focused photographer recommendation native D1 and R2 checks
        working-directory: apps/worker
        run: node tests/photographer-routes-focused.mjs

      - name: Run scoped collaboration native D1 and R2 checks
        working-directory: apps/worker
        run: node tools/test-staging-collaboration-validation.mjs

      - name: Run client activity and Oracle native checks through the existing TypeScript runner
        run: pnpm exec vitest run tests/unit/client-activity-native.test.ts tests/unit/oracle-storage-policy-native.test.ts tests/unit/oracle-storage-admission-native.test.ts

      - name: Verify local proof hashes and fail-closed profile rules
        run: pnpm exec vitest run --config vitest.photo-pins.config.ts

      - name: Verify release evidence
        run: node tools/check-staging-collaboration-release.mjs --self-test

      - name: Verify exact CI run and current B resources before deploy
        run: node tools/check-staging-collaboration-release.mjs --predeploy
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the checked scoped profile
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --config wrangler.collaboration-validation.jsonc --message "Kino Pic collaboration validation source ${RELEASE_SOURCE_SHA}"
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment while public entry remains closed and write receipt
        run: node tools/check-staging-collaboration-release.mjs --postdeploy
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Archive non-secret deployment and proof metadata
        uses: actions/upload-artifact@v4
        with:
          name: kino-pic-collaboration-validation-${{ inputs.source_sha }}
          path: .local/staging-collaboration-validation-release-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enable only the verified B workers.dev entry
        run: node tools/enable-staging-collaboration-entry.mjs
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record the verified deployment as the next release baseline
        uses: actions/github-script@v7
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const assert = require('node:assert/strict');
            const receipt = JSON.parse(fs.readFileSync('.local/staging-collaboration-validation-release-receipt.json', 'utf8'));
            assert.equal(receipt.sourceSha, process.env.RELEASE_SOURCE_SHA);
            assert.equal(receipt.status, 'passed_scoped_b_collaboration_deployment_pre_enable');
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (main.commit.sha !== receipt.sourceSha) {
              core.setFailed('Main moved during deployment; retain the artifact and reconcile the baseline before another release.');
              return;
            }
            const path = 'docs/releases/collaboration-prior-deployment.json';
            const { data: prior } = await github.rest.repos.getContent({ ...context.repo, path, ref: 'main' });
            const record = {
              schemaVersion: 1,
              status: 'verified_prior_scoped_b_deployment',
              workflowRunId: context.runId,
              receiptSha256: crypto.createHash('sha256').update(JSON.stringify(receipt, null, 2) + '\n').digest('hex'),
              receipt,
            };
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, branch: 'main', sha: prior.sha,
              message: 'chore: record verified B deployment baseline',
              content: Buffer.from(JSON.stringify(record, null, 2) + '\n').toString('base64'),
            });
