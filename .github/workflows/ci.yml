name: checks
# Private-repo Actions minutes are limited, so the full suite runs once per
# change: on main pushes (which gate the automatic deploy) and on pull
# requests, never again for the same commit on a feature-branch push.
# Documentation-only changes (including the deploy bot's receipt commit under
# docs/releases/) skip the suite. Push docs together with code while a deploy
# is pending: the auto deploy only dispatches when the checked commit is still
# the main head, so a separate docs-only push in between skips that deploy.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
concurrency:
  # A newer push to the same branch/PR supersedes the older run.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python tools/check_handoff.py
      - name: Verify Oracle filesystem admission guard
        run: python -m unittest discover -s tests -p 'test_oracle_storage_fs.py'
      - run: node --test tools/release-inventory.test.mjs
      - name: Production copy and closed-bootstrap safety checks
        run: node --test apps/worker/tools/rehearse-production-copy.test.mjs apps/worker/tools/copy-production-r2.test.mjs tools/check-production-bootstrap.test.mjs tools/check-production-release.test.mjs tools/secret-only-child.test.mjs tools/production-schema-adoptions.test.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Native schema upgrades, photo pins and manual R2 cleanup
        run: pnpm exec vitest run --config vitest.photo-pins.config.ts
      - run: pnpm test:integration
      - name: Build the product Worker and unified frontend
        run: pnpm build
      - name: Build the isolated pick ingress without deploying
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --dry-run --config ../gateway/wrangler.jsonc --outdir .local/gateway-build
      - name: Scoped synthetic Guest staging boundary (no remote providers)
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --dry-run --config wrangler.guest-validation.jsonc --outdir .local/guest-validation-build
          node tools/test-staging-guest-validation.mjs
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --config playwright.freehand.config.ts
      - run: pnpm exec playwright test --config playwright.guest-annotations-freehand.config.ts
      - run: pnpm exec playwright test --config playwright.owner-annotation-freehand.config.ts
      - run: pnpm test:cloudflare
      - name: Isolated staging auth validation (no provider credentials)
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --dry-run --config wrangler.auth-validation.jsonc --outdir .local/auth-validation-build
          node tools/test-staging-auth-validation.mjs
      - name: Processing recipe migration and native upload/gallery integration
        working-directory: apps/worker
        run: |
          node tools/check-processing-recipes-schema.mjs --check
          pnpm --dir ../.. exec vitest run --config vitest.processing-recipes.config.ts
      - name: Owner-only staging upload validation boundary
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --dry-run --config wrangler.upload-validation.jsonc --outdir .local/upload-validation-build
          node tools/test-staging-upload-validation.mjs
      - name: Audited album activation migration and native Owner API
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --dry-run --config wrangler.activation-validation.jsonc --outdir .local/activation-validation-build
          node tests/album-activation.mjs

      - name: Photographer metadata private R2 and recommendation API acceptance
        working-directory: apps/worker
        run: node tests/photographer-routes-focused.mjs
      - name: Scoped B collaboration validation (ephemeral native D1 and R2)
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --dry-run --config wrangler.collaboration-validation.jsonc --outdir .local/collaboration-validation-build
          node tools/test-staging-collaboration-validation.mjs

      - name: Representative version approval and fixed delivery UI
        working-directory: apps/worker
        run: node tests/version-approvals-browser.mjs

      - name: Verify deployable local release evidence
        run: node tools/check-staging-collaboration-release.mjs --self-test
