name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python tools/check_handoff.py
      - run: node --test tools/release-inventory.test.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec playwright test --config playwright.freehand.config.ts
      - run: pnpm exec playwright test --config playwright.guest-annotations-freehand.config.ts
      - run: pnpm exec playwright test --config playwright.owner-annotation-freehand.config.ts
      - run: pnpm exec playwright test --config playwright.gump-demo.config.ts
      - run: pnpm test:cloudflare
      - name: Isolated staging auth validation (no provider credentials)
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --dry-run --config wrangler.auth-validation.jsonc --outdir .local/auth-validation-build
          node tools/test-staging-auth-validation.mjs
      - name: Processing recipe migration and native upload/gallery integration
        working-directory: apps/worker
        run: |
          node tools/check-processing-recipes-schema.mjs --check
          node tests/processing-recipes.mjs
