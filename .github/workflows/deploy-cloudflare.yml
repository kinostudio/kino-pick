name: Closed production bootstrap on Cloudflare B
run-name: Closed production bootstrap @ ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA with successful checks
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'kinostudio/kino-pick'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify exact CI and live B resources; public entry must remain closed
        run: node tools/check-production-bootstrap.mjs --predeploy
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the closed production bootstrap
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env production --message "Kino Pick production bootstrap source ${RELEASE_SOURCE_SHA}"
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify bindings, active source and closed entry
        run: node tools/check-production-bootstrap.mjs --postdeploy
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: kino-pick-production-bootstrap-${{ inputs.source_sha }}
          path: .local/production-bootstrap-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
