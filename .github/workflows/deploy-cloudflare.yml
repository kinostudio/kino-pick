name: controlled Cloudflare deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:cloudflare
      - name: Verify Kino Pick Cloudflare B target
        shell: bash
        run: |
          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "d3e930465c0df7e89b35de3ca65ea36a" ]]; then
            echo "Cloudflare account does not match the Kino Pick target; deployment stopped."
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Require reviewed cutover gates (closed in foundation phase)
        run: node tools/check-cloudflare-deployment.mjs "$DEPLOY_ENV"
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
      - name: Deploy approved target
        run: pnpm --filter @kino-pic/worker exec wrangler deploy --env "$DEPLOY_ENV"
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
