name: Auto deploy Cloudflare B after checks
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: kino-pick-auto-deploy-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'kinostudio/kino-pick' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the deployment target for the current checked main
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: main } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            if (main.commit.sha !== run.head_sha) {
              core.notice('A newer main commit exists; skipping this older CI result.');
              return;
            }
            let workflow = 'deploy-collaboration-validation.yml';
            let target;
            try {
              const { data: file } = await github.rest.repos.getContent({
                ...context.repo,
                path: 'apps/worker/deployment-target.json',
                ref: run.head_sha,
              });
              if (file.type !== 'file' || file.encoding !== 'base64' || typeof file.content !== 'string') {
                core.setFailed('Deployment target file has an unsupported format.');
                return;
              }
              try {
                target = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
              } catch {
                core.setFailed('Deployment target file is not valid JSON.');
                return;
              }
              if (!target || typeof target !== 'object' || Array.isArray(target) ||
                  Object.keys(target).length !== 1 || !Object.hasOwn(target, 'environment')) {
                core.setFailed('Deployment target file has an unsupported shape.');
                return;
              }
            } catch (error) {
              if (error.status !== 404) {
                core.setFailed('Deployment target lookup failed; only 404 allows staging fallback.');
                return;
              }
              target = { environment: 'staging' };
              core.notice('No deployment target file exists; using the legacy staging workflow.');
            }
            if (target.environment === 'production') {
              workflow = 'deploy-production.yml';
            } else if (target.environment !== 'staging') {
              core.setFailed('Deployment target environment is not recognized.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: workflow,
              ref: 'main',
              inputs: { source_sha: run.head_sha },
            });
            core.notice('Dispatched ' + workflow + ' for ' + run.head_sha);
