name: Auto deploy Cloudflare B after checks
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: kino-pick-auto-deploy-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'kinostudio/kino-pick' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch existing gated deployment for the current checked main
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: main } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            if (main.commit.sha !== run.head_sha) {
              core.notice('A newer main commit exists; skipping this older CI result.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'deploy-collaboration-validation.yml',
              ref: 'main',
              inputs: { source_sha: run.head_sha },
            });
            core.notice('Dispatched gated Cloudflare B deployment for ' + run.head_sha);
